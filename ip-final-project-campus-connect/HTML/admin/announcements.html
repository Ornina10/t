<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Announcements - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        h1 { color: #2c3e50; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        textarea { min-height: 100px; }
        button {
            background: #3498db;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background: #2980b9; }
        .announcement-item {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }
        .announcement-item h3 { margin: 0 0 10px 0; }
        .delete-btn {
            background: #e74c3c;
            margin-left: 10px;
        }
        .delete-btn:hover { background: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-bullhorn"></i> Manage Announcements</h1>
        
        <h2>Create New Announcement</h2>
        <form id="announcementForm">
            <div class="form-group">
                <label>Title:</label>
                <input type="text" id="title" required>
            </div>
            <div class="form-group">
                <label>Message:</label>
                <textarea id="message" required></textarea>
            </div>
            <div class="form-group">
                <label>Type:</label>
                <select id="type">
                    <option value="info">Info</option>
                    <option value="warning">Warning</option>
                    <option value="success">Success</option>
                    <option value="deadline">Deadline</option>
                </select>
            </div>
            <button type="submit"><i class="fas fa-plus"></i> Post Announcement</button>
        </form>
        
        <hr>
        
        <h2>Existing Announcements</h2>
        <div id="announcements-list">
            <p>Loading announcements...</p>
        </div>
    </div>

    <script>
        const API_BASE = '/campus-connect/php--campus-connect-application-2/backendpart/announcements/';
        
        // Load existing announcements
        async function loadAnnouncements() {
            try {
                const response = await fetch(API_BASE + 'get_announcements.php');
                const data = await response.json();
                
                if (data.status === 'success') {
                    displayAnnouncements(data.data);
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        function displayAnnouncements(announcements) {
            const container = document.getElementById('announcements-list');
            
            if (announcements.length === 0) {
                container.innerHTML = '<p>No announcements yet.</p>';
                return;
            }
            
            container.innerHTML = '';
            announcements.forEach(ann => {
                const div = document.createElement('div');
                div.className = 'announcement-item';
                div.innerHTML = `
                    <h3>${escapeHtml(ann.title)}</h3>
                    <p>${escapeHtml(ann.message)}</p>
                    <small>Posted by: ${escapeHtml(ann.created_by)} | ${ann.created_at}</small>
                    <br><br>
                    <button onclick="deleteAnnouncement(${ann.id})" class="delete-btn">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                `;
                container.appendChild(div);
            });
        }
        
        // Create announcement
        document.getElementById('announcementForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                title: document.getElementById('title').value,
                message: document.getElementById('message').value,
                created_by: 'Admin'
            };
            
            try {
                const response = await fetch(API_BASE + 'create_announcement.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    alert('Announcement posted successfully!');
                    document.getElementById('announcementForm').reset();
                    loadAnnouncements();
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });
        
        // Delete announcement
        async function deleteAnnouncement(id) {
            if (confirm('Are you sure you want to delete this announcement?')) {
                try {
                    const response = await fetch(API_BASE + 'delete_announcement.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: id })
                    });
                    
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        alert('Announcement deleted!');
                        loadAnnouncements();
                    } else {
                        alert('Error: ' + result.message);
                    }
                } catch (error) {
                    console.error('Error:', error);
                }
            }
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Load announcements on page load
        loadAnnouncements();
    </script>
</body>
</html>
